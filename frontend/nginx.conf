upstream rapipedido {
    # Docker resuelve "app" a la IP de cada réplica del monolito
    server app:8080 max_fails=3 fail_timeout=2s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # API REST, WebSocket del tracking, Swagger y health → monolito
    location ~ ^/(api|ws|actuator|swagger-ui|v3/api-docs) {
        proxy_pass http://rapipedido;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        add_header X-Replica $upstream_addr always;   # qué réplica respondió
    }

    # Front React (SPA): cualquier otra ruta devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}
